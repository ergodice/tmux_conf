# =========================
# Basic settings
# =========================

# Prefix: C-b -> C-a
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# 256 colors / true color
set -g default-terminal "tmux-256color"
set -as terminal-overrides ",xterm-256color:RGB"

# Start window/pane numbering from 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows automatically
set -g renumber-windows on

# Mouse support
set -g mouse on

# Increase scrollback
set -g history-limit 100000

# Reduce escape delay (useful for Vim/Neovim)
set -sg escape-time 10

# Don't rename windows automatically
set -g allow-rename off

# Status refresh interval
set -g status-interval 5

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "tmux.conf reloaded"


# =========================
# Window / pane creation
# =========================

# Split panes while keeping current directory
unbind %
unbind '"'

bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in current directory
bind c new-window -c "#{pane_current_path}"


# =========================
# Vim-like pane navigation
# =========================

# prefix + h/j/k/l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with prefix + H/J/K/L
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5


# =========================
# Vim-like copy mode
# =========================

setw -g mode-keys vi

# Enter copy mode
bind [ copy-mode

# Vim-like selection
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Copy selection
bind -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Escape copy mode
bind -T copy-mode-vi Escape send-keys -X cancel

# Search
bind -T copy-mode-vi / command-prompt -i -p "search:" \
    "send-keys -X search-forward '%%'"

bind -T copy-mode-vi ? command-prompt -i -p "search backward:" \
    "send-keys -X search-backward '%%'"


# =========================
# Window navigation
# =========================

# prefix + n / p
bind n next-window
bind p previous-window

# Vim-like window movement
bind -r C-h previous-window
bind -r C-l next-window


# =========================
# Misc
# =========================

# Kill pane without asking
bind x kill-pane

# Synchronize input across panes
bind S setw synchronize-panes

# Quickly toggle zoom
bind z resize-pane -Z

# Longer display time for messages
set -g display-time 2000
